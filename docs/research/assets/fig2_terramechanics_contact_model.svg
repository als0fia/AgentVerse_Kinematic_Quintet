<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1520; }
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #94a3b8; }
      .axis { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .text-math { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #f59e0b; }
      .wheel-body { fill: #1e293b; stroke: #64748b; stroke-width: 3; }
      .normal-stress { stroke: #ef4444; stroke-width: 2.5; fill: none; }
      .shear-stress { stroke: #10b981; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="850" height="420" fill="#0d1520" rx="12"/>
  <text x="30" y="35" class="title">FIGURE 2: Terramechanics Contact Kinematics and Stress Distribution (Bekker-Wong Model)</text>
  <text x="30" y="55" class="subtitle">Wheel-soil interface showing entry angle (θ₁), exit angle (θ₂), sinkage (z₀), normal stress p(θ), and shear stress τ(θ)</text>

  <path d="M 50 250 L 265 250 Q 425 250 425 350 L 585 350 Q 750 250 800 250 L 800 390 L 50 390 Z" fill="rgba(120, 53, 15, 0.3)"/>
  <line x1="50" y1="250" x2="800" y2="250" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="790" y="242" font-family="DM Sans" font-size="11" fill="#d97706" text-anchor="end">Undisturbed Paddy Soil Surface</text>

  <g transform="translate(425, 200)">
    <circle cx="0" cy="0" r="150" class="wheel-body"/>
    <circle cx="0" cy="0" r="16" fill="#f59e0b"/>
    <line x1="-180" y1="0" x2="180" y2="0" class="axis"/>
    <line x1="0" y1="-180" x2="0" y2="180" class="axis"/>

    <line x1="0" y1="-120" x2="0" y2="-20" stroke="#f59e0b" stroke-width="3"/>
    <path d="M -6 -30 L 0 -15 L 6 -30 Z" fill="#f59e0b"/>
    <text x="15" y="-60" font-family="Plus Jakarta Sans" font-size="14" font-weight="bold" fill="#f59e0b">W (Wheel Load = 55.2 N)</text>

    <path d="M -40 -40 A 55 55 0 0 1 40 -40" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 33 -48 L 45 -40 L 37 -30 Z" fill="#38bdf8"/>
    <text x="50" y="-45" font-family="Plus Jakarta Sans" font-size="13" font-weight="bold" fill="#38bdf8">T (Drive Torque)</text>

    <line x1="0" y1="0" x2="-120" y2="90" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="0" x2="90" y2="120" stroke="#64748b" stroke-width="2"/>

    <path d="M 0 70 A 70 70 0 0 1 -56 42" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="-35" y="60" font-family="JetBrains Mono" font-size="12" fill="#f59e0b">θ₁ = 42.6°</text>

    <path d="M 0 70 A 70 70 0 0 0 42 56" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="60" font-family="JetBrains Mono" font-size="12" fill="#10b981">θ₂ = 12.1°</text>
  </g>

  <line x1="265" y1="250" x2="265" y2="350" stroke="#ef4444" stroke-width="2"/>
  <line x1="255" y1="250" x2="275" y2="250" stroke="#ef4444" stroke-width="2"/>
  <line x1="255" y1="350" x2="275" y2="350" stroke="#ef4444" stroke-width="2"/>
  <text x="245" y="305" font-family="JetBrains Mono" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="end">z₀ = 4.2 cm</text>

  <path d="M 305 290 Q 425 385 515 320" class="normal-stress"/>
  <text x="350" y="375" class="text-math" fill="#ef4444">Normal Stress p(θ) = (k_c/b + k_φ) z^n</text>

  <path d="M 305 290 Q 445 350 515 320" class="shear-stress" stroke-dasharray="4 2"/>
  <text x="530" y="350" class="text-math" fill="#10b981">Shear Stress τ(θ) = (c + p tan φ)[1 - e^(-j/K)]</text>
</svg>
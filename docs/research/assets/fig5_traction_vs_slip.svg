<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1520; }
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #94a3b8; }
      .grid { stroke: #1e293b; stroke-width: 1; }
      .axis-line { stroke: #475569; stroke-width: 2; }
      .axis-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748b; }
      .curve-gross { stroke: #38bdf8; stroke-width: 3; fill: none; }
      .curve-res { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 5 3; fill: none; }
      .curve-net { stroke: #10b981; stroke-width: 3.5; fill: none; }
    </style>
  </defs>

  <rect width="850" height="420" class="bg" rx="12"/>
  <text x="30" y="35" class="title">FIGURE 5: Drawbar Pull H_net(i) and Motion Resistance R(i) vs. Slip Ratio i</text>
  <text x="30" y="55" class="subtitle">Calculated via Janosi-Hanamoto model for ANTENNA Wheel in flooded paddy silt (c = 2.5 kPa, K = 0.022 m)</text>

  <line x1="80" y1="80" x2="80" y2="330" class="axis-line"/>
  <line x1="80" y1="330" x2="780" y2="330" class="axis-line"/>

  <line x1="80" y1="267" x2="780" y2="267" class="grid"/><text x="70" y="271" class="axis-text" text-anchor="end">50 N</text>
  <line x1="80" y1="205" x2="780" y2="205" class="grid"/><text x="70" y="209" class="axis-text" text-anchor="end">100 N</text>
  <line x1="80" y1="142" x2="780" y2="142" class="grid"/><text x="70" y="146" class="axis-text" text-anchor="end">150 N</text>
  <line x1="80" y1="80" x2="780" y2="80" class="grid"/><text x="70" y="84" class="axis-text" text-anchor="end">200 N</text>

  <line x1="220" y1="80" x2="220" y2="330" class="grid"/><text x="220" y="348" class="axis-text" text-anchor="middle">0.20 (Optimum)</text>
  <line x1="360" y1="80" x2="360" y2="330" class="grid"/><text x="360" y="348" class="axis-text" text-anchor="middle">0.40</text>
  <line x1="500" y1="80" x2="500" y2="330" class="grid"/><text x="500" y="348" class="axis-text" text-anchor="middle">0.60</text>
  <line x1="640" y1="80" x2="640" y2="330" class="grid"/><text x="640" y="348" class="axis-text" text-anchor="middle">0.80</text>
  <line x1="780" y1="80" x2="780" y2="330" class="grid"/><text x="780" y="348" class="axis-text" text-anchor="middle">1.00 (Total Slip)</text>

  <rect x="185" y="80" width="70" height="250" fill="rgba(16, 185, 129, 0.12)"/>
  <line x1="220" y1="80" x2="220" y2="330" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2"/>

  <path d="M 80 330 Q 150 140 220 115 T 780 100" class="curve-gross"/>
  <text x="680" y="92" font-family="DM Sans" font-size="11" font-weight="bold" fill="#38bdf8">Gross Thrust H_gross</text>

  <path d="M 80 310 L 220 305 L 360 295 L 500 280 L 640 260 L 780 235" class="curve-res"/>
  <text x="690" y="250" font-family="DM Sans" font-size="11" font-weight="bold" fill="#ef4444">Motion Resistance R</text>

  <path d="M 80 330 Q 150 160 220 148 Q 360 160 780 185" class="curve-net"/>
  <text x="450" y="160" font-family="Plus Jakarta Sans" font-size="13" font-weight="bold" fill="#10b981">Net Drawbar Pull H_net (Peak @ i = 0.20)</text>

  <circle cx="220" cy="148" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <text x="232" y="142" font-family="JetBrains Mono" font-size="12" font-weight="bold" fill="#10b981">Peak: 145.4 N / wheel</text>

  <text x="430" y="380" font-family="Plus Jakarta Sans" font-size="12" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Wheel Slip Ratio i = (rω - v) / rω</text>
  <text x="25" y="200" font-family="Plus Jakarta Sans" font-size="12" font-weight="bold" fill="#f1f5f9" text-anchor="middle" transform="rotate(-90 25 200)">Traction Force (N)</text>
</svg>
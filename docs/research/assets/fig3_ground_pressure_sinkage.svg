<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1520; }
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #94a3b8; }
      .grid { stroke: #1e293b; stroke-width: 1; }
      .axis-label { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #64748b; }
      .bar-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: bold; fill: #f1f5f9; text-anchor: middle; }
      .val-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="850" height="400" class="bg" rx="12"/>
  <text x="30" y="35" class="title">FIGURE 3: Ground Pressure (kPa) and Sinkage Depth (cm) Performance Comparison</text>
  <text x="30" y="55" class="subtitle">Evaluated under standard Southern China paddy silt conditions (c = 2.5 kPa, φ = 12°, load W = 55.2 N/wheel)</text>

  <line x1="80" y1="100" x2="800" y2="100" class="grid"/>
  <text x="70" y="104" class="axis-label" text-anchor="end">15</text>
  <line x1="80" y1="160" x2="800" y2="160" class="grid"/>
  <text x="70" y="164" class="axis-label" text-anchor="end">10</text>
  <line x1="80" y1="220" x2="800" y2="220" class="grid"/>
  <text x="70" y="224" class="axis-label" text-anchor="end">5</text>
  <line x1="80" y1="280" x2="800" y2="280" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="284" class="axis-label" text-anchor="end">0</text>

  <g transform="translate(130, 0)">
    <rect x="0" y="146" width="45" height="134" fill="#ef4444" rx="4"/>
    <text x="22" y="136" class="val-label" fill="#ef4444">11.2 kPa</text>
    <rect x="52" y="118" width="45" height="162" fill="#dc2626" rx="4"/>
    <text x="74" y="108" class="val-label" fill="#fca5a5">13.5 cm</text>
    <text x="48" y="310" class="bar-label">Smooth Wheel</text>
  </g>

  <g transform="translate(310, 0)">
    <rect x="0" y="184" width="45" height="96" fill="#f59e0b" rx="4"/>
    <text x="22" y="174" class="val-label" fill="#f59e0b">8.0 kPa</text>
    <rect x="52" y="181" width="45" height="99" fill="#d97706" rx="4"/>
    <text x="74" y="171" class="val-label" fill="#fde68a">8.2 cm</text>
    <text x="48" y="310" class="bar-label">Fixed Lugged Steel</text>
  </g>

  <g transform="translate(490, 0)">
    <rect x="0" y="220" width="45" height="60" fill="#38bdf8" rx="4"/>
    <text x="22" y="210" class="val-label" fill="#38bdf8">5.0 kPa</text>
    <rect x="52" y="210" width="45" height="70" fill="#0284c7" rx="4"/>
    <text x="74" y="200" class="val-label" fill="#bae6fd">5.8 cm</text>
    <text x="48" y="310" class="bar-label">Archimedes Screw</text>
  </g>

  <g transform="translate(670, 0)">
    <rect x="0" y="235" width="45" height="45" fill="#10b981" rx="4"/>
    <text x="22" y="225" class="val-label" fill="#10b981">3.8 kPa</text>
    <rect x="52" y="230" width="45" height="50" fill="#059669" rx="4"/>
    <text x="74" y="220" class="val-label" fill="#a7f3d0">4.2 cm</text>
    <text x="48" y="310" class="bar-label" fill="#10b981">ANTENNA Wheel ★</text>
  </g>

  <g transform="translate(300, 355)">
    <rect x="0" y="0" width="16" height="12" fill="#38bdf8" rx="2"/>
    <text x="24" y="10" font-family="DM Sans" font-size="12" fill="#e2e8f0">Ground Pressure (kPa)</text>

    <rect x="180" y="0" width="16" height="12" fill="#059669" rx="2"/>
    <text x="204" y="10" font-family="DM Sans" font-size="12" fill="#e2e8f0">Sinkage Depth z₀ (cm)</text>
  </g>
</svg>
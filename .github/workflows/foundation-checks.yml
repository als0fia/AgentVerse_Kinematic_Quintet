name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository references and skills
        run: python scripts/check_repo.py
      - name: Verify cross-agent skill parity
        run: python scripts/sync_skills.py --check
      - name: Run foundation tests
        run: python -m unittest discover -s tests -v
